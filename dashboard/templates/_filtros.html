{# Segmentación (E9): se envía por GET; el país de un líder lo fija el servidor. #}
<form class="filtros" method="get" data-auto>
  <label class="filtro">
    <span>País</span>
    {% if controles.pais_fijo %}
      <select disabled title="Su rol solo ve este país"><option>{{ controles.pais }} (su rol)</option></select>
    {% else %}
      <select name="pais">
        <option value="">Todos</option>
        {% for p in controles.paises %}<option value="{{ p }}"{% if p == controles.pais %} selected{% endif %}>{{ p }}</option>{% endfor %}
      </select>
    {% endif %}
  </label>
  {% if not sin_plan %}
  <label class="filtro">
    <span>Plan</span>
    <select name="plan">
      <option value="">Todos</option>
      {% for p in controles.planes %}<option value="{{ p.plan_id }}"{% if p.plan_id == controles.plan_id %} selected{% endif %}>{{ p.nombre_plan }}</option>{% endfor %}
    </select>
  </label>
  {% elif controles.plan_id %}
    <input type="hidden" name="plan" value="{{ controles.plan_id }}">
  {% endif %}
  <label class="filtro">
    <span>Año</span>
    <select name="anio">
      <option value="">2022–2025</option>
      {% for a in controles.anios %}<option value="{{ a }}"{% if a == controles.anio %} selected{% endif %}>{{ a }}</option>{% endfor %}
    </select>
  </label>
  <noscript><button type="submit" class="boton chico">Aplicar</button></noscript>
  {% if controles.pais and not controles.pais_fijo or controles.plan_id and not sin_plan or controles.anio %}
    <a class="filtros-limpiar" href="?">Quitar filtros</a>
  {% endif %}
</form>
