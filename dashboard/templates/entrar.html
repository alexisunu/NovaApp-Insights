{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · NovaApp Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap">
  <link rel="stylesheet" href="{% static 'dashboard/app.css' %}">
</head>
<body class="pagina-entrar">
  <main class="entrar">
    <div class="marca">
      <strong>NovaApp Insights</strong>
      <span>Proyecto integrador · 251G8F</span>
    </div>
    <form method="post" class="tarjeta entrar-tarjeta">
      {% csrf_token %}
      <h1>Entrar</h1>
      <p class="sub">Lo que ve depende de su rol: Dirección, Líder de zona o Soporte.</p>
      {% if form.errors %}
        <p class="mensaje error">Usuario o contraseña incorrectos.</p>
      {% endif %}
      <label class="campo">
        <span>Usuario</span>
        <input type="text" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
      </label>
      <label class="campo">
        <span>Contraseña</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="boton primario ancho">Entrar</button>
    </form>
  </main>
</body>
</html>
